<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>제5기 경기도 청년참여기구 총회</title>
<meta name="theme-color" content="#0D0D0D">
<meta property="og:title" content="제5기 경기도 청년참여기구 총회">
<meta property="og:description" content="2026. 9. 12.(토) · 차기 운영방향 논의">
<style>

/* ── 발표자료의 하늘색 배경 + 흰 패널 조합을 그대로 가져온다 ── */
:root{
  --sky1:#5CB8EC; --sky2:#3E9FDC; --sky-deep:#2E8BD5;
  --blue:#0E5AA7; --blue-mid:#2E8BD5; --blue-pale:#E4EFFA; --blue-tint:#F5F9FC;
  --ink:#15263A; --mid:#5A6B7D; --faint:#93A3B4;
  --line:#E2EAF3; --line-soft:#EDF2F8;
  --paper:#FFFFFF;
  --warn:#C0552F; --warn-bg:#FAE7E1;
  --r:16px; --pad:22px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);
  background:var(--sky2);
  background-image:radial-gradient(120% 60% at 12% 0%,rgba(255,255,255,.30),transparent 55%),
                   linear-gradient(168deg,var(--sky1) 0%,var(--sky2) 62%,#348FCE 100%);
  background-attachment:fixed;
  font-family:"경기천년제목 Medium","경기천년제목","Pretendard",-apple-system,BlinkMacSystemFont,
    "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15.5px;line-height:1.62;letter-spacing:-.014em;-webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;font-family:"경기천년제목 Bold","경기천년제목",inherit;letter-spacing:-.035em}

/* ── 하늘 영역 ── */
.sky{max-width:620px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 20px) var(--pad) 16px;
  color:#fff;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sky .brand{margin:0;font-size:13.5px;font-weight:700;letter-spacing:-.01em}
.sky .when{margin:0;font-size:12.5px;opacity:.82}

/* ── 흰 시트 ── */
.app{max-width:620px;margin:0 auto;background:var(--paper);
  border-radius:26px 26px 0 0;min-height:calc(100dvh - 70px);
  box-shadow:0 -4px 40px rgba(9,55,102,.16)}
nav{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);
  backdrop-filter:saturate(160%) blur(12px);border-bottom:1px solid var(--line);
  border-radius:26px 26px 0 0}
.tabs{display:flex;overflow-x:auto;scrollbar-width:none;padding:0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;appearance:none;background:none;border:0;color:var(--faint);
  font-size:14px;font-weight:600;padding:16px 13px;cursor:pointer;white-space:nowrap;
  border-bottom:2.5px solid transparent;transition:color .15s,border-color .15s}
.tab[aria-selected="true"]{color:var(--blue);border-bottom-color:var(--blue-mid)}
.tab:focus-visible{outline:2px solid var(--blue-mid);outline-offset:-4px;border-radius:5px}
.tab.admin{color:#B8C6D4;font-size:13px}
.tab.admin::before{content:"";display:inline-block;width:1px;height:13px;background:var(--line);
  margin-right:13px;vertical-align:-2px}
.tab.admin[aria-selected="true"]{color:var(--blue)}
.tab .dot{display:inline-block;width:5px;height:5px;border-radius:50%;
  background:var(--blue-mid);vertical-align:5px;margin-left:5px}

main{padding:26px var(--pad) 8px;animation:fade .22s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 슬라이드 머리 ── */
.badge{display:inline-block;background:var(--sky-deep);color:#fff;border-radius:999px;
  padding:6px 16px;font-size:12.5px;font-weight:700;letter-spacing:-.01em;
  font-family:"경기천년제목 Bold",inherit}
.ptitle{margin:14px 0 0;font-size:27px;line-height:1.26;font-weight:800}
.psub{margin:10px 0 24px;font-size:14.5px;color:var(--mid);line-height:1.62}
h2{margin:32px 0 12px;font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--blue-mid)}
main>h2:first-child{margin-top:0}
p.body{margin:0 0 14px;color:var(--mid);font-size:14.5px}
.hint{margin:-4px 0 14px;font-size:13.5px;color:var(--mid);line-height:1.6}
.note{font-size:12.5px;color:var(--faint);margin:14px 0 0;line-height:1.65}

/* ── 카드 ── */
.card{background:var(--blue-tint);border:1px solid var(--line);border-radius:var(--r);
  padding:17px 18px;margin:0 0 10px}
.card.on{background:var(--blue);border-color:var(--blue)}
.card.on .k{color:rgba(255,255,255,.75)}
.card.on .v{color:#fff}
.card.on .meta,.card.on p{color:rgba(255,255,255,.88)}
.k{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--blue-mid);margin:0 0 8px}
.card .v{font-size:18px;font-weight:700;letter-spacing:-.025em;margin:0 0 5px;
  font-family:"경기천년제목 Bold",inherit}
.meta{font-size:13.5px;color:var(--mid);margin:0;line-height:1.6}
.card p{margin:0;font-size:14px;color:var(--mid);line-height:1.6}

/* ── 진행 순서 ── */
.rail{position:relative;padding-left:68px}
.rail::before{content:"";position:absolute;left:54px;top:9px;bottom:12px;width:1px;background:var(--line)}
.step{position:relative;padding:0 0 20px}
.step .t{position:absolute;left:-68px;top:-1px;width:46px;text-align:right;
  font-size:13.5px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.step::before{content:"";position:absolute;left:-18px;top:7px;width:7px;height:7px;border-radius:50%;
  background:var(--paper);box-shadow:0 0 0 1.5px var(--line)}
.step.on .t{color:var(--blue)}
.step.on::before{background:var(--blue-mid);box-shadow:0 0 0 1.5px var(--blue-mid)}
.step.past .n{color:var(--faint);font-weight:500}
.step .n{font-size:15.5px;font-weight:700;letter-spacing:-.025em;margin:0 0 3px}
.step .d{font-size:13px;color:var(--mid);margin:0}
.live-dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--blue-mid);
  margin-right:7px;vertical-align:3px;animation:pulse 1.9s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ── 통계 ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 9px}
.stat{background:var(--blue-tint);border:1px solid var(--line);border-radius:13px;
  padding:16px 8px;text-align:center}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.045em;color:var(--blue);
  font-family:"경기천년제목 Bold",inherit;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11.5px;color:var(--mid);margin-top:3px}

/* ── 타임라인 ── */
.tl{position:relative;padding-left:22px}
.tl::before{content:"";position:absolute;left:5px;top:9px;bottom:10px;width:1px;background:var(--line)}
.ev{position:relative;padding:0 0 16px}
.ev::before{content:"";position:absolute;left:-21px;top:7px;width:7px;height:7px;border-radius:50%;
  background:var(--paper);box-shadow:0 0 0 1.5px var(--line)}
.ev.key::before{background:var(--blue-mid);box-shadow:0 0 0 1.5px var(--blue-mid)}
.ev b{display:block;font-size:14.5px;font-weight:600}
.ev span{display:block;font-size:12.5px;color:var(--faint)}

/* ── 표 ── */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 0 10px}
table{width:100%;min-width:500px;border-collapse:collapse;font-size:13px;
  border:1px solid var(--line);border-radius:13px;overflow:hidden}
th,td{padding:9px 7px;text-align:center;border-bottom:1px solid var(--line-soft);
  font-variant-numeric:tabular-nums}
th{background:var(--blue-tint);font-weight:700;font-size:11.5px;color:var(--mid);letter-spacing:.02em}
td:first-child,th:first-child{text-align:left;padding-left:14px;font-variant-numeric:normal}
td{color:var(--mid)}
tr:last-child td{border-bottom:0;background:var(--blue-tint);color:var(--ink);font-weight:700}

/* ── 지도 ── */
.mapbox{background:var(--blue-tint);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 10px 10px;margin:0 0 12px}
svg.gg{display:block;width:100%;height:auto;touch-action:manipulation}
svg.gg path{fill:#fff;stroke:#B9CDE1;stroke-width:1.4;cursor:pointer;transition:fill .13s,stroke .13s}
svg.gg path.north{stroke-dasharray:8 5}
svg.gg g:active path{fill:#DCEAF7}
svg.gg text{font-size:30px;fill:#7089A2;text-anchor:middle;pointer-events:none;
  font-weight:600;letter-spacing:-.05em}
svg.gg text.on{fill:#fff}
svg.gg g:focus-visible path{stroke:var(--ink);stroke-width:3.5}
.grpbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin:0 2px 12px}
.gchip{appearance:none;display:inline-flex;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-size:13px;
  font-weight:600;color:var(--mid);cursor:pointer;transition:all .13s}
.gchip i{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.gchip b{font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.gchip[aria-selected="true"]{border-color:var(--blue);color:var(--blue);
  box-shadow:0 0 0 2px rgba(14,90,167,.1)}
.gchip .x{margin-left:2px;color:var(--faint);font-weight:700;font-size:14px;line-height:1}
.gadd{appearance:none;background:none;border:1px dashed #BCCDDE;border-radius:999px;
  padding:7px 13px;font-size:13px;font-weight:600;color:var(--mid);cursor:pointer}
.gadd:disabled{opacity:.4;cursor:default}
.legend{display:flex;gap:16px;margin:11px 4px 0;font-size:11.5px;color:var(--faint)}
.legend s{display:inline-block;width:11px;height:11px;border-radius:3px;
  border:1px dashed #B9CDE1;vertical-align:-1px;margin-right:6px;text-decoration:none}
.picked{margin:12px 3px 0;font-size:13.5px;line-height:1.6}
.picked div{display:flex;gap:9px;align-items:flex-start;margin:0 0 7px;word-break:keep-all}
.picked i{width:9px;height:9px;border-radius:50%;flex:0 0 auto;margin-top:7px}
.picked b{font-weight:700;color:var(--ink)}
.picked span{color:var(--mid)}
.picked em{font-style:normal;color:var(--faint)}

/* ── 입력 ── */
.field{margin:0 0 16px}
label{display:block;font-size:11px;font-weight:700;letter-spacing:.13em;color:var(--blue-mid);margin:0 0 8px}
input[type=text],textarea,select{width:100%;background:#fff;border:1px solid var(--line);
  border-radius:11px;font-size:15.5px;padding:13px 14px;transition:border-color .13s,box-shadow .13s}
textarea{resize:vertical;min-height:86px;line-height:1.6}
input::placeholder,textarea::placeholder{color:var(--faint)}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue-mid);
  box-shadow:0 0 0 3px rgba(46,139,213,.14)}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--faint) 50%),
  linear-gradient(135deg,var(--faint) 50%,transparent 50%);
  background-position:calc(100% - 20px) 22px,calc(100% - 14px) 22px;
  background-size:6px 6px,6px 6px;background-repeat:no-repeat}

/* ── 선택지 ── */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{appearance:none;text-align:left;width:100%;background:#fff;border:1.5px solid var(--line);
  border-radius:12px;padding:14px 15px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;
  transition:border-color .13s,background .13s}
.opt .tick{flex:0 0 20px;height:20px;border-radius:6px;border:1.5px solid var(--line);margin-top:1px;
  display:grid;place-items:center;font-size:11px;color:transparent;transition:all .13s}
.opt[aria-pressed="true"]{border-color:var(--blue-mid);background:var(--blue-pale)}
.opt[aria-pressed="true"] .tick{background:var(--blue-mid);border-color:var(--blue-mid);color:#fff}
.opt .t{flex:1;min-width:0}
.opt .t b{display:block;font-size:15px;font-weight:700;letter-spacing:-.025em;
  font-family:"경기천년제목 Bold",inherit}
.opt .t span{display:block;font-size:12.5px;color:var(--mid);margin-top:3px;line-height:1.5}
.opt.round .tick{border-radius:50%}
.opt:focus-visible{outline:2px solid var(--blue-mid);outline-offset:2px}
.gname{font-size:11px;font-weight:700;letter-spacing:.15em;color:var(--blue);margin:24px 3px 10px}

/* ── 버튼 ── */
.btn{width:100%;appearance:none;border:0;border-radius:12px;background:var(--blue);color:#fff;
  font-size:15.5px;font-weight:700;padding:16px;cursor:pointer;letter-spacing:-.025em;
  font-family:"경기천년제목 Bold",inherit;transition:opacity .13s}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--mid)}
.btn:disabled{opacity:.4;cursor:default}
.btn:active{opacity:.85}
.msg{font-size:13px;text-align:center;margin:12px 0 0;color:var(--warn);min-height:18px}
.msg.ok{color:var(--blue)}

/* ── 알림 · 잠금 ── */
.alert{background:var(--warn-bg);border:1px solid #EDCFC4;border-radius:var(--r);
  padding:17px 18px;margin:0 0 11px}
.alert .k{color:var(--warn)}
.alert p{margin:0;font-size:14px;color:#7A3A28;line-height:1.62}
.locked{background:var(--blue-tint);border:1px dashed #BCCDDE;border-radius:var(--r);
  padding:42px 20px;text-align:center;color:var(--faint);font-size:14px;line-height:1.7}
.reveal{background:linear-gradient(142deg,var(--sky-deep),var(--blue));border-radius:var(--r);
  padding:28px 20px;text-align:center;margin:0 0 11px;color:#fff}
.reveal .sm{font-size:11px;font-weight:700;letter-spacing:.15em;opacity:.82;margin:0}
.reveal .bg{font-size:26px;font-weight:800;margin:10px 0 0;line-height:1.3;letter-spacing:-.03em;
  font-family:"경기천년제목 Bold",inherit}

/* ── 진행 표시 ── */
.prog{display:flex;align-items:center;gap:8px;margin:14px 0 0}
.prog i{flex:1;height:4px;border-radius:99px;background:rgba(255,255,255,.3)}
.prog i.on{background:#fff}
.prog span{font-size:12px;color:rgba(255,255,255,.8);font-variant-numeric:tabular-nums}

/* ── 결과 ── */
.nowbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--blue-tint);
  border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:0 0 12px;
  font-size:13px;color:var(--mid)}
.nowbar b{color:var(--ink);font-weight:700}
.nowdot{width:7px;height:7px;border-radius:50%;background:var(--blue-mid);flex:0 0 auto;
  animation:pulse 1.9s ease-in-out infinite}
.nowbtn{margin-left:auto;appearance:none;background:var(--blue);border:0;color:#fff;
  border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}
.chip{appearance:none;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;font-size:13px;font-weight:600;color:var(--mid);cursor:pointer}
.chip[aria-selected="true"]{background:var(--blue);border-color:var(--blue);color:#fff}
.bar{display:flex;align-items:center;gap:10px;margin:0 0 9px;font-size:13.5px}
.bar .lb{flex:0 0 116px;text-align:right;color:var(--mid);word-break:keep-all;line-height:1.4}
.bar .tr{flex:1;height:20px;background:var(--blue-pale);border-radius:6px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--blue-mid);border-radius:6px;
  transition:width .6s cubic-bezier(.22,1,.36,1)}
.bar.top .tr i{background:var(--blue)}
.bar .vv{flex:0 0 32px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--mid)}
.bar.top .vv{color:var(--blue)}
.pairs div{display:flex;justify-content:space-between;padding:10px 0;
  border-bottom:1px solid var(--line);font-size:14px;color:var(--mid)}
.pairs div:last-child{border:0}
.pairs span{color:var(--blue);font-weight:800;font-variant-numeric:tabular-nums}
.qcount{margin:0 0 10px;font-size:12.5px;color:var(--faint)}
.qmore{appearance:none;width:100%;background:#fff;border:1px solid var(--line);border-radius:11px;
  padding:12px;font-size:13.5px;font-weight:700;color:var(--blue);cursor:pointer;margin:4px 0 0}
.qmore:active{background:var(--blue-tint)}
.q{border-left:2px solid var(--blue-mid);padding:2px 0 2px 13px;margin:0 0 14px;
  font-size:14.5px;color:var(--ink);line-height:1.62}
.q em{display:block;font-style:normal;font-size:11.5px;color:var(--faint);margin-top:5px}
/* ── 콘솔 탭 ── */
.htabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);
  margin:0 0 22px;padding:0 0 2px}
.htabs button{appearance:none;background:none;border:0;border-bottom:2.5px solid transparent;
  padding:11px 15px;font-size:14.5px;font-weight:700;color:var(--faint);cursor:pointer;
  letter-spacing:-.02em;transition:color .13s,border-color .13s}
.htabs button:hover{color:var(--mid)}
.htabs button.on{color:var(--blue);border-bottom-color:var(--blue-mid)}
.hsec{margin:30px 0 12px}
.hsec:first-of-type{margin-top:0}
.hsec h3{font-size:16.5px;font-weight:800;letter-spacing:-.03em;margin:0 0 6px}
.hguide{margin:0;font-size:13.5px;color:var(--mid);line-height:1.68;
  background:var(--blue-tint);border-left:3px solid var(--blue-mid);
  border-radius:0 10px 10px 0;padding:11px 14px}
.hguide b{color:var(--ink)}
.ctl button.danger{color:var(--warn);border-color:#EDCFC4}
.ctl button.danger:hover{background:var(--warn-bg);color:var(--warn)}
.qrbox{display:flex;gap:18px;align-items:center;background:var(--blue-tint);
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0 0;flex-wrap:wrap}
.qrbox svg{display:block;border:1px solid var(--line);border-radius:10px;background:#fff;padding:6px}
.qrbox>div:last-child{flex:1;min-width:220px}
.testbox{margin:12px 0 0}
.tline{font-size:13.5px;padding:9px 13px;border-radius:9px;margin:0 0 6px;line-height:1.5}
.tline.ok{background:var(--blue-tint);color:var(--blue)}
.tline.no{background:var(--warn-bg);color:var(--warn)}
.rows{max-height:340px;overflow:auto}
.prow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.prow:last-child{border:0}
.prow .pd{flex:0 0 72px;font-weight:700;color:var(--ink)}
.prow .pn{flex:0 0 68px;color:var(--mid)}
.prow .pt{flex:1;color:var(--blue-mid);font-weight:700;letter-spacing:.14em;font-variant-numeric:tabular-nums}
.host h2{margin:30px 0 12px;font-size:11px;letter-spacing:.18em;color:var(--blue)}
.host>h2:first-of-type{margin-top:22px}
.guide{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;
  padding:20px;background:rgba(9,55,102,.45);backdrop-filter:blur(3px);
  animation:gfade .2s ease}
@keyframes gfade{from{opacity:0}to{opacity:1}}
.gcard{background:#fff;border-radius:22px;padding:26px 24px;max-width:460px;width:100%;
  max-height:88vh;overflow:auto;box-shadow:0 16px 60px rgba(9,55,102,.3)}
.gsteps{list-style:none;counter-reset:g;margin:0 0 22px;padding:0}
.gsteps li{counter-increment:g;display:flex;gap:13px;padding:13px 0;border-top:1px solid var(--line-soft)}
.gsteps li:first-child{border-top:0;padding-top:0}
.gsteps li::before{content:counter(g);flex:0 0 24px;height:24px;border-radius:50%;
  background:var(--blue-pale);color:var(--blue);font-size:12.5px;font-weight:800;
  display:grid;place-items:center;margin-top:1px}
.gsteps b{display:block;font-size:15px;font-weight:700;letter-spacing:-.02em}
.gsteps span{display:block;font-size:13.5px;color:var(--mid);line-height:1.6;margin-top:3px}
.movebar{position:sticky;top:52px;z-index:25;display:none;align-items:center;gap:10px;flex-wrap:wrap;
  margin:0 var(--pad);padding:12px 15px;background:var(--blue);color:#fff;

    }
    finder(0,0); finder(0,size-7); finder(size-7,0);

    for (var t = 8; t < size-8; t++){
      var v = (t % 2 === 0) ? 1 : 0;
      set(6, t, v); set(t, 6, v);

}

var MEM = [], MEMSTATE = {cue:0, open:{d1:1,d2:1,d3:1}, reveal:{name:0,award:0}, notice:"",
  screen:{v:"idle",p:0}, follow:0, show:1, reset:"", pin:"", roster:[]};
var CACHE = [], LASTID = 0, NETFAIL = 0;

function sbHead(extra){
  var h = {"apikey":SB_KEY, "Authorization":"Bearer "+SB_KEY, "Content-Type":"application/json"};
  for(var k in (extra||{})) h[k] = extra[k];
  return h;
}
var Store = {
  live:function(){ return !!(SB_URL && SB_KEY); },

  post:function(body){
    if (body.type === "state") return Store.saveState(body.state);
    if (body.type === "rows")  return Store.postMany(body.recs);
    return Store.postMany([body.rec]);
  },

  postMany:function(recs){
    if(!Store.live()){ recs.forEach(function(r){ MEM.push(r); }); return Promise.resolve(true); }
    if(typeof fetch !== "function") return Promise.reject(new Error("브라우저가 지원하지 않습니다"));
    return fetch(SB_URL+"/rest/v1/gg_rows", {
      method:"POST", headers:sbHead({"Prefer":"return=minimal"}),
      body:JSON.stringify(recs.map(function(r){ return {d:r}; }))
    }).then(function(r){ if(!r.ok) throw new Error("저장 실패 "+r.status); return true; });
  },

  saveState:function(st){
    if(!Store.live()){ MEMSTATE = st; return Promise.resolve(true); }
    if(typeof fetch !== "function") return Promise.reject(new Error("브라우저가 지원하지 않습니다"));
    return fetch(SB_URL+"/rest/v1/gg_state?id=eq.1", {
      method:"PATCH", headers:sbHead({"Prefer":"return=minimal"}),
      body:JSON.stringify({d:st})
    }).then(function(r){ if(!r.ok) throw new Error("저장 실패 "+r.status); return true; });
  },

  fetchAll:function(){
    if(!Store.live()) return Promise.resolve({rows:MEM.slice(), state:MEMSTATE});
    if(typeof fetch !== "function"){ NETFAIL++; return Promise.resolve({rows:CACHE.slice(), state:STATE}); }
    try{
    var rowsUrl = SB_URL+"/rest/v1/gg_rows?select=id,d&order=id.asc&limit=2000"
                + (LASTID ? "&id=gt."+LASTID : "");
    return Promise.all([
      fetch(rowsUrl, {headers:sbHead()}).then(function(r){
        if(!r.ok) throw new Error("조회 실패 "+r.status); return r.json(); }),
      fetch(SB_URL+"/rest/v1/gg_state?select=d&id=eq.1", {headers:sbHead()}).then(function(r){
        if(!r.ok) throw new Error("조회 실패 "+r.status); return r.json(); })
    ]).then(function(res){
      (res[0]||[]).forEach(function(x){
        if(x.id > LASTID) LASTID = x.id;
        CACHE.push(x.d);
      });
      NETFAIL = 0;
      var st = (res[1] && res[1][0] && res[1][0].d) || {};
      return {rows:CACHE.slice(), state:Object.assign({}, MEMSTATE, st)};
    }).catch(function(){
      NETFAIL++;
      return {rows:CACHE.slice(), state:STATE};   // 끊겨도 마지막 화면은 유지
    });
    }catch(e){
      NETFAIL++;
      return Promise.resolve({rows:CACHE.slice(), state:STATE});
    }
  }
};

function mapSVG(o){
  o = o || {};
  if (o.deco) return '<svg viewBox="0 0 '+MAP.w+' '+MAP.h+'" xmlns="http://www.w3.org/2000/svg">' +
    MAP.sgg.map(function(s){ return '<path d="'+s.d+'"/>'; }).join("") + '</svg>';
  var heat=o.heat, max=o.max||1, colorOf=o.colorOf;
  var body = MAP.sgg.map(function(s){
    var style="", white=false, lab=s.n, pressed=false;
    if (colorOf){
      var c = colorOf(s.n);
      if (c){ style=' style="fill:'+c+';stroke:'+c+'"'; white=true; pressed=true; }
    } else if (heat){
      var a=(heat[s.n]||0)/max;
      style=' style="fill:rgba(14,90,167,'+(0.07+a*0.93).toFixed(3)+')"';
      lab = heat[s.n] ? (s.n+" "+heat[s.n]) : s.n;   // 0은 숫자를 붙이지 않는다
      white = a > 0.42;
    }
    return '<g'+(heat||o.deco?'':' tabindex="0" role="button" aria-label="'+esc(s.n)+'"')+
      ' data-sgg="'+esc(s.n)+'"><path d="'+s.d+'" class="'+(s.north?"north":"")+'" aria-pressed="'+
      (pressed?"true":"false")+'"'+style+'></path><text x="'+s.x+'" y="'+(s.y+8)+'"'+
      (white?' class="on"':'')+'>'+esc(lab)+'</text></g>';
  }).join("");
  return '<svg class="gg'+(heat?" heat":"")+'" viewBox="0 0 '+MAP.w+' '+MAP.h+
    '" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="경기도 시·군 지도">'+body+'</svg>';
}

/* ══════════ 14. 집계 ══════════ */
function tally(rows,key){
  var c={}; rows.forEach(function(r){ String(r[key]||"").split("|").filter(Boolean)
    .forEach(function(v){ c[v]=(c[v]||0)+1; }); }); return c;
}
function groupsOf(r){
  var raw=String(r.groups||"").trim();
  if(raw) return raw.split(";").map(function(g){return g.split("|").filter(Boolean);})
    .filter(function(g){return g.length>1;});
  var one=String(r.regions||"").split("|").filter(Boolean);
  return one.length>1?[one]:[];
}
function pairsOf(rows){
  var p={};
  rows.forEach(function(r){ groupsOf(r).forEach(function(g0){
    var g=g0.slice().sort();
    for(var i=0;i<g.length;i++) for(var j=i+1;j<g.length;j++){
      var k=g[i]+" · "+g[j]; p[k]=(p[k]||0)+1; }
  });});
  return p;
}
function zonesOf(rows){
  var pr=pairsOf(rows), keys=Object.keys(pr);
  if(!keys.length) return null;
  var maxN=0; keys.forEach(function(k){ if(pr[k]>maxN) maxN=pr[k]; });
  var thr=Math.max(2,Math.ceil(maxN*0.34)), parent={};
  function find(a){ while(parent[a]&&parent[a]!==a) a=parent[a]=parent[parent[a]]; return a; }
  function join(a,b){ parent[a]=parent[a]||a; parent[b]=parent[b]||b;
    var x=find(a),y=find(b); if(x!==y) parent[x]=y; }
  var used={};
  keys.forEach(function(k){ if(pr[k]<thr) return;
    var p=k.split(" · "); join(p[0],p[1]); used[p[0]]=1; used[p[1]]=1; });
  var bag={};
  Object.keys(used).forEach(function(n){ var r=find(n); (bag[r]=bag[r]||[]).push(n); });
  var zones=Object.keys(bag).map(function(r){return bag[r].sort();})
    .filter(function(z){return z.length>1;}).sort(function(a,b){return b.length-a.length;});
  if(!zones.length) return null;
  var idx={}; zones.forEach(function(z,i){ z.forEach(function(n){ idx[n]=i; }); });
  return {zones:zones, idx:idx, thr:thr};
}
function bars(counts, order, cls){
  var max=0; for(var k in counts) if(counts[k]>max) max=counts[k];
  var keys=order||Object.keys(counts).sort(function(a,b){return counts[b]-counts[a];});
  if(!keys.some(function(k){return counts[k];})) return '<p class="empty">아직 응답이 없습니다.</p>';
  return keys.map(function(k){
    var v=counts[k]||0;
    return '<div class="'+(cls||"bar")+(v&&v===max?" top":"")+'"><span class="lb">'+esc(k)+
      '</span><span class="tr"><i style="width:'+(max?Math.round(v/max*100):0)+'%"></i></span>'+
      '<span class="vv">'+v+'</span></div>';
  }).join("");
}
function commentsOf(rows){
  var likes = {};
  rows.filter(function(r){return r.part==="like";})
      .sort(function(a,b){ return String(a.ts||"")<String(b.ts||"")?-1:1; })
      .forEach(function(r){
    var k=r.cmt; likes[k]=likes[k]||{};
    likes[k][r.uid] = String(r.v)==="1" ? 1 : 0;   // 같은 사람이 여러 번 눌러도 마지막만 반영
  });
  var latest = {};
  rows.filter(function(r){ return r.part==="cmt" && String(r.text||"").trim(); })
      .forEach(function(r){
        if(!latest[r.cid] || String(r.ts||"") >= String(latest[r.cid].ts||"")) latest[r.cid] = r;
      });
  return Object.keys(latest).map(function(cid){
    var r = latest[cid], m = likes[cid]||{}, n=0, mineOn=0;
    for(var u in m){ if(m[u]){ n++; if(u===UID) mineOn=1; } }
    return {cid:cid, kind:r.kind||"", target:r.target||"", text:r.text,
            who:r.who||"", ts:r.ts||"", n:n, mine:mineOn, byMe:(r.uid===UID)};
  });
}
var QMORE = {};
function quotesOf(rows,key,quiet){
  var l=rows.filter(function(r){return String(r[key]||"").trim();});
  if(!l.length) return quiet?"":'<p class="empty">아직 올라온 의견이 없습니다.</p>';
  var show = QMORE[key] || 10;
  var arr = l.slice().reverse();
  var head = l.length > 10
    ? '<p class="qcount">총 '+l.length+'건 · 최근 것부터</p>' : '';
  var body = arr.slice(0, show).map(function(r){
    return '<div class="q">'+esc(r[key])+'<em>'+esc(r.div||"")+'</em></div>'; }).join("");
  var rest = l.length - show;
  return head + body + (rest > 0
    ? '<button class="qmore" data-qmore="'+esc(key)+'">남은 '+rest+'건 더 보기</button>' : '');
}

    }).join("")+'</div>';

  body += '<p class="hint" style="margin:-6px 0 18px">'+esc(chipSub[RTAB]||"")+'</p>';

  if(RTAB==="d1"){

        || '<p class="empty">아직 올라온 의견이 없습니다.</p>') +
      '<h2>선택된 시·군</h2><p class="hint">진하게 표시될수록 많이 선택된 곳입니다.</p>' +
      '<div class="mapbox">'+mapSVG({heat:heat,max:mx})+'</div>' +
      '<h2>함께 묶인 시·군</h2><p class="hint">두 지역이 같은 분과로 함께 선택된 횟수입니다.</p>' +

    '</b> 처럼만 표시됩니다.</p>' +
    (CEDIT ? "" : '<button class="btn '+(TALKFORM?'':'ghost')+'" id="ctoggle" style="margin-bottom:16px">'+
      (TALKFORM?'접기':'＋ 새 의견 쓰기')+'</button>') +

        mineList.map(function(c){ return card(c, true); }).join("")
      : "") +
    '<h2>다른 위원들의 의견 '+others.length+'건</h2>' +
    '<p class="hint">읽기만 하셔도 됩니다. 공감되는 의견에 <b>♡ 공감</b>을 눌러 주세요. 공감이 많은 순으로 현장에서 다룹니다.</p>' +
    '<div class="chips" style="margin:4px 0 14px">' +
      '<button class="chip" data-cs="like" aria-selected="'+(CSORT==="like")+'">공감순</button>' +

  bind(".opts[data-grp='CK'] .opt", function(b){ b.onclick=function(){

  var cs = document.getElementById("csend");

    var btn=this; btn.disabled=true; btn.textContent="올리는 중";
    var cid = CEDIT || ("c"+Date.now().toString(36)+Math.random().toString(36).slice(2,6));
    Store.post({type:"row", rec:{part:"cmt", ts:new Date().toISOString(), cid:cid,
      uid:UID, who:who(), div:me.div, kind:CKIND_SEL, target:CTGT_SEL, text:t}})
      .then(function(){ return pull(); })
      .then(function(){ CEDIT=null; TALKFORM=false; SIG=sigOf(); quiet(vResults); })
      .catch(function(){ btn.disabled=false; btn.textContent=CEDIT?"고쳐서 올리기":"올리기";
        m.className="msg"; m.textContent="올리지 못했습니다. 잠시 후 다시 시도해 주세요."; });
  };
}

/* ══════════ 16. 현장 화면 ══════════ */
var LIVE={pane:0, auto:true, timer:null, poll:null, rot:null, seen:{}};
function lbars(c,o,n){ return bars(c,o,"lbar"); }
/* 화면에 넘치지 않게 상위 N개만 그리고, 나머지는 한 줄로 알린다 */
function lbarsTop(counts, keys, n){
  var sorted = keys.slice().sort(function(a,b){ return (counts[b]||0)-(counts[a]||0); });
  var shown = sorted.slice(0, n), rest = sorted.slice(n);
  var restSum = 0; rest.forEach(function(k){ restSum += counts[k]||0; });
  var sub = {}; shown.forEach(function(k){ sub[k] = counts[k]||0; });
  return bars(sub, shown, "lbar") +
    (rest.length ? '<p class="lmore">그 밖에 '+rest.length+'개 항목 · 합계 '+restSum+'건</p>' : '');
}
function lrank(pairs,n){
  var keys=Object.keys(pairs).sort(function(a,b){return pairs[b]-pairs[a];}).slice(0,n||10);
  if(!keys.length) return '<p class="lempty">아직 응답이 없습니다</p>';
  return '<div class="lrank">'+keys.map(function(k){
    return '<div><b>'+esc(k)+'</b><span>'+pairs[k]+'</span></div>'; }).join("")+'</div>';
}
var STREAMPAGE = 0, STREAMPAGES = 1, QRSHOW = false;
function lstream(rows,keys,limit){
  var items=[];
  rows.slice().reverse().forEach(function(r){ keys.forEach(function(k){
    var t=String(r[k]||"").trim();
    if(t) items.push({t:t, who:r.div||"", id:(r.ts||"")+k});   // 분과만 표시 · 이름은 내보내지 않음
  });});
  if(!items.length) return '<p class="lempty">의견이 올라오면 이곳에 표시됩니다</p>';
  var per = limit || 9;
  var pages = Math.max(1, Math.ceil(items.length / per));
  if (pages > STREAMPAGES) STREAMPAGES = pages;     // 이 화면에서 필요한 쪽수
  var pg = pages > 1 ? (STREAMPAGE % pages) : 0;
  var slice = items.slice(pg*per, pg*per + per);
  return '<div class="stream">'+slice.map(function(it){
      var fresh=!LIVE.seen[it.id]; LIVE.seen[it.id]=1;
      return '<div class="scard'+(fresh?" fresh":"")+'">'+esc(it.t)+'<em>'+esc(it.who)+'</em></div>';
    }).join("")+'</div>' +
    (pages > 1
      ? '<p class="lmore">전체 '+items.length+'건 중 '+(pg*per+1)+'–'+(pg*per+slice.length)+
        '번째 · 10초마다 다음 의견으로 넘어갑니다</p>'
      : '');
}

    (sub?'<p class="lsub">'+esc(sub)+'</p>':'')+
    '<div class="lbody">'+panes[idx]+'</div>'+
    '<div class="lfoot"><span>휴대폰으로 참여하기</span><span class="url">'+
    esc(url||"주소는 배포 후 표시됩니다")+'</span>'+
    (screenMode ? '<button class="qrbtn" id="qrtoggle" title="QR 보기 (Q)">QR</button>' : '')+
    '<span class="dots"><span class="dnum">'+(idx+1)+' / '+panes.length+'</span>'+

  /* 4. 권역안 */
  var p3='<div class="lcol" style="flex:1.35"><div class="lpanel fill">'+

      ? '같은 분과로 '+z.thr+'번 이상 함께 선택된 지역끼리 이었습니다'
      : n ? '아직 권역이 그려지지 않았습니다 · 지금은 선택된 횟수를 보여드립니다'
          : '응답이 들어오면 권역이 그려집니다')+
    '</p><div class="lmap">'+mapSVG(z?{colorOf:function(nm){
      return z.idx[nm]!=null?ZC[z.idx[nm]%ZC.length]:null; }}:{heat:heat,max:mx})+'</div></div></div>'+
    '<div class="lcol"><div class="lpanel fill"><h3>권역 구성</h3><p class="ps">'+
    (z?z.zones.length+'개 권역으로 나뉩니다':'같은 두 지역을 함께 고른 분이 2명 이상이면 선이 이어집니다')+
    '</p><div class="lscroll">'+
    (z?'<div class="zonelist">'+z.zones.map(function(zz,i){
      return '<div><i style="background:'+ZC[i%ZC.length]+'"></i><span>'+esc(zz.join(" · "))+
        '<em>'+zz.length+'개</em></span></div>'; }).join("")+'</div>'
      : n ? '<p class="lempty">지금까지 '+n+'명이 응답했습니다<br>겹치는 조합이 나오면 권역이 그려집니다</p>'
          : '<p class="lempty">아직 응답이 없습니다</p>')+'</div></div></div>';

function screenMove(dir){

  for (var i = 0; i < list.length; i++)
    if (list[i].v===cur.v && list[i].p===(cur.p||0)) { at = i; break; }
  var n = (at + dir + list.length) % list.length;
  STATE.screen = {v:list[n].v, p:list[n].p};

                      .catch(function(){ vScreen(); });

document.addEventListener("keydown", function(e){
  var h0=(location.hash||"").replace(/^#\/?/,"");
  if(h0==="screen"){
    if(e.key==="ArrowRight"||e.key==="ArrowLeft"||e.key==="PageDown"||e.key==="PageUp"||
       e.key==="ArrowDown"||e.key==="ArrowUp"){
      e.preventDefault();
      var fwd = (e.key==="ArrowRight"||e.key==="PageDown"||e.key==="ArrowDown");
      screenMove(fwd?1:-1);
    }
    else if(e.key===" "){ e.preventDefault();
      STATE.show = (STATE.show===undefined?1:STATE.show) ? 0 : 1;
      if(adminOK()) Store.post({type:"state", state:STATE}).then(function(){ vScreen(); })
                         .catch(function(){ vScreen(); });
      else vScreen();
    }
    else if(e.key==="q"||e.key==="Q"){ e.preventDefault(); QRSHOW = !QRSHOW; vScreen(); }
    else if(e.key==="Escape"){ if(QRSHOW){ QRSHOW = false; vScreen(); } }
    else if(e.key==="f"||e.key==="F"){
      if(document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    }
    return;
  }
  var h=h0;
  if(h.indexOf("live/")!==0) return;
  var which=h.split("/")[1];
  var n=LIVEDEF[which]?LIVEDEF[which][3]().length:1;
  if(e.key==="ArrowRight"||e.key==="ArrowLeft"){
    e.preventDefault(); LIVE.auto=false;
    LIVE.pane=(LIVE.pane+(e.key==="ArrowRight"?1:n-1))%n; vLive(which);
  } else if(e.key==="a"||e.key==="A"){ LIVE.auto=!LIVE.auto; vLive(which); }
  else if(e.key==="f"||e.key==="F"){
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
  }
});

      .catch(function(){ b.disabled=false; b.textContent="리허설 응답 넣기";
        alert("넣지 못했습니다. 잠시 후 다시 시도해 주세요."); }); };
  if((el=document.getElementById("rostsave"))) el.onclick=function(){
    var list=parseRoster(valOf("rost"));
    if(!list.length){ alert("형식을 확인해 주세요. 한 줄에 «7분과 이기영» 처럼 적어야 합니다."); return; }
    STATE.roster=list; pushState(); };
  if((el=document.getElementById("rostedit"))) el.onclick=function(){
    if(!confirm("등록된 명단을 지우고 다시 입력할까요?")) return;
    STATE.roster=[]; pushState(); };
  if((el=document.getElementById("pinchg"))) el.onclick=function(){
    var v=valOf("np"), m=document.getElementById("pcmsg");
    if(!/^\d{4,8}$/.test(v)){ m.className="msg"; m.textContent="숫자 4자리 이상으로 정해 주세요."; return; }
    STATE.pin=pinHash(v); m.className="msg ok"; m.textContent="바꿨습니다."; pushState(); };
  if((el=document.getElementById("lock"))) el.onclick=function(){
    clearAdmin(); location.hash="#/host"; route(); };
  if((el=document.getElementById("selftest"))) el.onclick=function(){ selfTest(this); };
}

function selfTest(btn){
  var box = document.getElementById("testbox"), lines = [], t0 = Date.now();
  btn.disabled = true; btn.textContent = "점검 중";
  function say(ok, msg){
    lines.push('<div class="tline '+(ok?"ok":"no")+'">'+(ok?"✓":"✕")+" "+msg+'</div>');
    box.innerHTML = lines.join("");
  }
  function done(){ btn.disabled=false; btn.textContent="다시 점검하기"; }
  if(!Store.live()){
    say(false, "서버 주소가 비어 있습니다. 지금은 연습 모드라 다른 기기와 공유되지 않습니다.");
    done(); return;
  }
  say(true, "서버 주소 확인 — " + esc(SB_URL.replace("https://","")));
  var mark = "st" + Date.now();
  Store.post({type:"row", rec:{part:"selftest", ts:new Date().toISOString(), uid:mark}})
    .then(function(){ say(true, "응답 쓰기 성공 (" + (Date.now()-t0) + "ms)"); return pull(); })
    .then(function(){
      var found = RAW.some(function(r){ return r.part==="selftest" && r.uid===mark; });
      say(found, found ? "응답 읽기 성공 — 방금 쓴 내용을 다시 받아왔습니다"
                       : "응답 읽기 실패 — 쓴 내용이 보이지 않습니다");
      return Store.post({type:"state", state:STATE});
    })
    .then(function(){ say(true, "진행 상태 저장 성공"); return pull(); })
    .then(function(){
      say(true, "모두 정상입니다 · 총 " + (Date.now()-t0) + "ms");
      say(true, "점검용 기록은 집계에 잡히지 않습니다. 신경 쓰지 않으셔도 됩니다.");
      done();
    })
    .catch(function(e){
      var m = (e && e.message) || String(e);
      say(false, "실패 — " + esc(m));
      if(/401|403/.test(m)) say(false, "키가 거절되었습니다. Supabase의 anon 키로 바꿔야 할 수 있습니다.");
      else if(/row-level|policy/i.test(m)) say(false, "권한 설정 문제입니다. SQL의 policy 부분을 다시 실행해 주세요.");
      else say(false, "인터넷 연결이나 주소를 확인해 주세요.");
      done();
    });
}

var MASTER_PIN = "0712";   // PIN을 잊었을 때 쓰는 예비 번호. 필요하면 이 값만 바꾸세요
function pinHash(p){
  var h = 5381, str = "gg5-" + String(p);
  for (var i = 0; i < str.length; i++) h = ((h * 33) ^ str.charCodeAt(i)) >>> 0;
  return "h" + h.toString(36);
}
function pinOK(p){
  if (String(p) === MASTER_PIN) return true;
  return !!STATE.pin && pinHash(p) === STATE.pin;
}
function adminOK(){
  try{ return localStorage.getItem("gg5adm")==="1"; }catch(e){ return false; }
}
function setAdmin(){ try{ localStorage.setItem("gg5adm","1"); }catch(e){} }
function clearAdmin(){ try{ localStorage.removeItem("gg5adm"); }catch(e){} }

/* ══════════ 17.5 콘솔 보조 ══════════ */
function pushState(){
  Store.post({type:"state", state:STATE}).then(function(){
    ROWS = applyFilters(RAW);      // 초기화·제외를 곧바로 반영
    vHost();
  }).catch(function(){ alert("저장하지 못했습니다. 잠시 후 다시 시도해 주세요."); });

function csv(){
  var cols=["part","ts","uid","name","div","groups","regions","reason","fixR","fixRetc","fixA","fixAetc",
            "cond","stage","stageEtc","ways","waysEtc","way","topics",

/* 위원 명단 — 「7분과 이기영」 형식을 한 줄에 한 명씩 */
function parseRoster(txt){
  var out=[];
  String(txt||"").split(/[\n\r]+/).forEach(function(line){
    line = line.trim();
    if(!line) return;
    var m = line.match(/(\d+)\s*분과/);
    if(!m) return;
    var name = line.replace(m[0], "").replace(/[,\t·\-|]+/g, " ").trim();
    if(!name) return;
    out.push([m[1]+"분과", name]);
  });
  return out;
}
function rosterStat(){
  var roster = (STATE.roster||[]), done = {};
  ROWS.forEach(function(r){
    if(["d1","d2","d3"].indexOf(r.part)<0) return;
    if(r.name && r.div) done[r.div+"/"+String(r.name).trim()] = 1;
  });
  var by = {};
  roster.forEach(function(p){
    var d=p[0]; by[d]=by[d]||{yes:[],no:[]};
    (done[d+"/"+p[1]] ? by[d].yes : by[d].no).push(p[1]);
  });
  return {by:by, total:roster.length,
          yes:roster.filter(function(p){ return done[p[0]+"/"+p[1]]; }).length};
}

/* 리허설용 가상 응답 — 12개 분과 한 명씩 + 의견 5건 */
function rehearsalRows(){
  var pick=function(a,n){ var c=a.slice(),o=[];
    while(o.length<n&&c.length) o.push(c.splice(Math.floor(Math.random()*c.length),1)[0]); return o; };
  var cl=[["수원","용인","화성","오산"],["성남","광주","하남"],["고양","파주","김포"],
          ["의정부","양주","동두천","남양주"],["안양","군포","의왕","과천"],["부천","광명","시흥","안산"],
          ["포천","연천","가평"],["평택","안성","오산"],["이천","여주","광주"],["양평","가평","남양주"],
          ["김포","부천","고양"],["수원","의왕","군포"]];
  var nm=["김민준","이서연","박지후","최유진","정하윤","강도현","조서윤","윤지안",
          "장예준","임하은","한시우","오다인"];
  var out=[], now=Date.now();
  for(var i=0;i<12;i++){
    var uid="rh"+i, div=DIVISIONS[i], name=nm[i], g2=cl[(i+4)%cl.length];
    var base={ts:new Date(now-(13-i)*60000).toISOString(), uid:uid, name:name, div:div};
    out.push(Object.assign({part:"d1",
      groups: cl[i].join("|")+(i%3?"":";"+g2.join("|")),
      regions: cl[i].concat(i%3?[]:g2).join("|"),
      reason: i%2?"":["대중교통으로 30분 안에 닿습니다","생활권이 이어져 있습니다","모임 장소를 잡기 쉬웠습니다"][i%3],
      fixR: pick(FIX_REGION.map(function(x){return x[0];}),2).join("|"),
      fixA: pick(FIX_AGENDA.map(function(x){return x[0];}),2).join("|"),
      cond: i%5?"":"회의 공간을 미리 잡아 주셨으면 합니다"}, base));
    out.push(Object.assign({part:"d2",
      stage: STAGES[i%5][0],
      ways: pick(WAYS.map(function(x){return x[0];}),2).join("|"),
      way: i%4?"":"제안자가 직접 설명하는 자리가 있으면 좋겠습니다"}, base));
    out.push(Object.assign({part:"d3",
      topics: pick(TOPICS[i%4][2],2).join("|"),
      keep: i%6?"":"정책 제안 활동은 그대로 이어갔으면 합니다",
      culture: i%7?"":"분과별 운영 편차를 줄일 기준이 필요합니다"}, base));
  }
  var demo=[["개선 제안","논의 1","권역을 나눌 때 이동시간 60분을 기준으로 잡았으면 합니다"],
            ["동의","논의 2","제안자가 직접 설명하는 자리가 꼭 필요하다고 봅니다"],
            ["다른 의견","논의 1","의제별로 바꾸면 북부 참여가 더 어려워질 것 같습니다"],
            ["질문","논의 2","미선정 제안은 다음 기수로 넘어가나요?"],
            ["개선 제안","논의 3","분과장 교육을 활동 시작 전에 한 번 했으면 합니다"]];
  demo.forEach(function(x,i){
    var cid="rhc"+i;
    out.push({part:"cmt", ts:new Date(now-(6-i)*60000).toISOString(), cid:cid, uid:"rh"+i,
      who:DIVISIONS[i]+" "+mask(nm[i]), div:DIVISIONS[i], kind:x[0], target:x[1], text:x[2]});
    for(var j=0;j<(5-i);j++)
      out.push({part:"like", ts:new Date(now-(5-i)*60000+j*100).toISOString(),
        cmt:cid, uid:"rhv"+i+"_"+j, v:"1"});
  });
  return out;
}

/* ══════════ 18. 라우팅 ══════════ */
var RAW = [];
function applyFilters(raw){
  var cut = (STATE && STATE.reset) || "";
  var rows = raw.filter(function(r){ return !cut || String(r.ts||"") >= cut; });
  var ex = {};
  rows.forEach(function(r){ if(r.part==="modu") ex[r.uid] = String(r.v)==="1"; });
  rows = rows.filter(function(r){ return r.part==="modu" || !(r.uid && ex[r.uid]); });
  var hid = {};
  rows.forEach(function(r){ if(r.part==="mod") hid[r.cmt] = String(r.v)==="1"; });
  rows = rows.filter(function(r){ return !(r.part==="cmt" && hid[r.cid]); });
  // 같은 사람이 다시 제출하면 마지막 것만 센다
  var last = {}, other = [];
  rows.forEach(function(r){
    if(["d1","d2","d3"].indexOf(r.part) < 0){ other.push(r); return; }
    var k = r.part + "|" + (r.uid || (r.div+"/"+r.name));
    if(!last[k] || String(r.ts||"") >= String(last[k].ts||"")) last[k] = r;
  });
  for(var k in last) other.push(last[k]);
  return other;
}
var LASTFOLLOW = null, MOVETO = null;
function followCheck(h){
  if(!STATE.follow || !STATE.screen) return;
  var t = STATE.screen.v;
  if(["d1","d2","d3"].indexOf(t) < 0) return;
  if(t === LASTFOLLOW) return;        // 진행자가 화면을 바꾼 순간에만 한 번
  LASTFOLLOW = t;
  if(h === t) return;
  if(!ready()) return;
  if(!sent[t]){                       // 아직 안 낸 논의면 데려간다
    location.hash = "#/" + t;
  } else {                            // 이미 낸 사람은 붙잡지 않고 알림만
    MOVETO = t;
    showMoveBar();
  }
}
function moveLabel(k){ return {d1:"논의 1", d2:"논의 2", d3:"논의 3"}[k] || k; }
function showMoveBar(){
  var bar = document.getElementById("movebar");
  if(!bar || !MOVETO) return;
  bar.innerHTML = '<span>진행자가 <b>'+moveLabel(MOVETO)+'</b>로 넘어갔습니다</span>'+
    '<button class="mv" id="mvgo">보러 가기</button>'+
    '<button class="mx" id="mvx">닫기</button>';
  bar.style.display = "flex";
  document.getElementById("mvgo").onclick = function(){
    var t = MOVETO; MOVETO = null; hideMoveBar(); location.hash = "#/" + t; };
  document.getElementById("mvx").onclick = function(){ MOVETO = null; hideMoveBar(); };
}
function hideMoveBar(){
  var bar = document.getElementById("movebar");
  if(bar){ bar.style.display = "none"; bar.innerHTML = ""; }
}
function pull(){
  return Store.fetchAll().then(function(d){
    STATE=d.state||STATE;
    RAW=d.rows||[];
    ROWS=applyFilters(RAW);
    var t=new Date();
    LASTSYNC=("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2)+":"+("0"+t.getSeconds()).slice(-2);
    try{ restoreMine(); }catch(e){}
    return d;
  }).catch(function(){ return {}; });
}
var ROUTES={"":vHome,"review":vReview,"d1":vD1,"d2":vD2,"d3":vD3,"results":vResults,"host":vHost};
function route(){
  var h=(location.hash||"#/").replace(/^#\/?/,"").split("?")[0];
  clearInterval(LIVE.timer); clearInterval(LIVE.poll); clearInterval(LIVE.rot);
  if(h==="screen"){ pull().then(vScreen); return; }
  if(h.indexOf("live")===0){
    var w=h.split("/")[1];
    if(w) pull().then(function(){ vLive(w); }); else vLiveHub();
    return;
  }
  if(h==="host"){ pull().then(vHost); return; }
  var v=ROUTES[h]||vHome;
  if(h==="results") pull().then(v); else v();
}
window.addEventListener("hashchange", route);
document.addEventListener("visibilitychange", function(){
  if(document.hidden) return;
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h==="results"||h==="host"||h==="screen"||h.indexOf("live/")===0)
    pull().then(function(){ SIG=sigOf(); route(); });
});
setInterval(function(){
  if(document.hidden) return;
  var h=(location.hash||"").replace(/^#\/?/,"");
  if(h==="host"||h==="screen"||h.indexOf("live/")===0) return;
  pull().then(function(){
    followCheck(h);
    var sg = sigOf();
    if (sg === SIG) return;               // 바뀐 게 없으면 화면을 건드리지 않는다
    SIG = sg;
    if (typing()) return;                 // 입력 중이면 다음 기회에
    if (h==="" ) quiet(vHome);
    else if (h==="results") quiet(vResults);
  });
},8000);
pull().then(function(){ SIG=sigOf(); route(); });
